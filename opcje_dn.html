   if(pts.length){const q=pts[pts.length-1];lab.push({y:y(q.v),n:s.n,v:q.v,c:s.c})}});
  lab.sort((a,b)=>a.y-b.y);for(let i=1;i<lab.length;i++)if(lab[i].y-lab[i-1].y<12)lab[i].y=lab[i-1].y+12;
  lab.forEach(a=>g+=`<text x="${l+pw+8}" y="${a.y+3.5}" font-size="10" font-weight="600" fill="${a.c}" ${O5F}>${a.n} <tspan fill="${M.cl(a.v)}" ${O5M}>${M.f?M.f(a.v):fmt(a.v,2)}</tspan></text>`);
  return `<svg class="o5svg" viewBox="0 0 ${W} ${H}"${o5xa({y:M.inv?[t,t+ph,lo,hi]:[t,t+ph,hi,lo],yd:2,yl:M.ref===1?'P/C':'RR',days:{l,dw,lab:DAYS.map(dl),intr:!!dayLab,t0:600,t1:1335},rx:[l,l+pw],ry:[t,t+ph]})} role="img" aria-label="${tit}"><defs><pattern id="o5hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${col.mut}" stroke-width="1" stroke-opacity=".35"/></pattern></defs>${g}</svg><p class="o5h">${sub}</p>`};
 // 1) P/C wolumenu: sesje w ciągu (każdy dzień = 10:00–22:15 PL), linia serii przez kolejne dni do wygaśnięcia

// ---------- Skew / uśmiech IV: IV strony OTM w funkcji strike'a dla każdej serii, punkty ATM i 25Δ, RR i BF
function o5skw(d,o,w){const col=o5col(),CAT=o5cat(),E=o5E(o),cE=e=>CAT[E.indexOf(e)%CAT.length],S=o.series.filter(s=>s.smile&&s.smile.length),B=o.basis||0,P=d.snaps[idx].price-B;
 if(!S.length){w.innerHTML='<p class="o5h">Brak danych IV.</p>';return}
 const W=1240,H=440,l=56,r=110,t=30,b=44,pw=W-l-r,ph=H-t-b,half=Math.min(330,Math.max(...S.map(s=>(s.straddle||60)*2.3)));
 const x0=o.spx-half,x1=o.spx+half,pts=S.flatMap(s=>s.smile.filter(q=>q[0]>=x0&&q[0]<=x1).map(q=>q[1]));
 const lo=Math.floor(Math.min(...pts)-1),hi=Math.ceil(Math.max(...pts)+1),X=k=>l+(k-x0)/(x1-x0)*pw,Y=v=>t+(hi-v)/(hi-lo)*ph;let g='';
 const sy=(hi-lo)>20?5:2;for(let v=Math.ceil(lo/sy)*sy;v<=hi;v+=sy)g+=`<line x1="${l}" x2="${l+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col.line}" stroke-width=".6"/><text x="${l-6}" y="${Y(v)+3.5}" text-anchor="end" font-size="10" fill="${col.mut}" ${O5M}>${v}%</text>`;
 const sx=half>250?50:25;for(let k=Math.ceil(x0/sx)*sx;k<=x1;k+=sx)g+=`<line x1="${X(k)}" x2="${X(k)}" y1="${t}" y2="${t+ph}" stroke="${col.line}" stroke-width=".5"/><text x="${X(k)}" y="${t+ph+15}" text-anchor="middle" font-size="10" fill="${col.mut}" ${O5M}>${fmt(k,0)}</text>`;

 g+=`<line x1="${X(o.spx)}" x2="${X(o.spx)}" y1="${t}" y2="${t+ph}" stroke="${col.ink}" stroke-width="1.2" stroke-dasharray="4 3"/><text x="${X(o.spx)+4}" y="${t+11}" font-size="10" font-weight="600" fill="${col.ink}" ${O5F}>SPX ${fmt(o.spx,1)}</text>`;

  if(s.k25)[[s.k25[0],s.iv25[0],'put 25Δ'],[s.k25[1],s.iv25[1],'call 25Δ']].forEach(([k,v,n])=>{if(k>=x0&&k<=x1)g+=`<rect x="${X(k)-5}" y="${Y(v)-5}" width="10" height="10" rx="2" transform="rotate(45 ${X(k)} ${Y(v)})" fill="${c}" stroke="${css('--panel')}" stroke-width="1.5"><title>${s.lab} · ${n} SPX ${fmt(k,0)}: IV ${fmt(v,1)}%</title></rect>`});
  g+=`<circle cx="${X(o.spx)}" cy="${Y(s.atm_iv)}" r="4" fill="${css('--panel')}" stroke="${c}" stroke-width="2"><title>${s.lab} · IV ATM ${fmt(s.atm_iv,1)}%</title></circle>`;
  const z=q[0];lab.push({y:Y(z[1]),n:s.lab,c,v:s.rr25})});

 // legenda po prawej: RR każdej serii
 S.forEach((s,i)=>g+=`<text x="${l+pw+10}" y="${t+14+i*16}" font-size="10.5" font-weight="600" fill="${cE(s.exp)}" ${O5F}>${s.lab} <tspan fill="${s.rr25<0?col.dn:col.up}" ${O5M}>RR ${o5sg(s.rr25,2)}</tspan></text>`);
