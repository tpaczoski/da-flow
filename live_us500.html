<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>US500 na żywo – Footprint wielu interwałów – DA Flow</title>
<style>
:root{
  --navy:#1b3a5f; --navy2:#2c5282; --green:#1f7a4d; --red:#c0392b; --muted:#66706c;
  --text:#1c2321; --line:#dfe3e0; --bg:#ffffff; --foot:#f3f4f6; --price:#1c2321;
  --poc:#1d4f91; --bar:#8b958f; --vwap:#9333ea;
  --f:"DejaVu Sans",Verdana,"Segoe UI",system-ui,sans-serif;
  --fn:"DejaVu Sans Mono","Liberation Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:13px}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;padding:10px 16px}
.brand{font-weight:700;font-size:17px;letter-spacing:.01em}
.brand small{font-weight:400;font-size:11px;opacity:.7;margin-left:4px}
.ttl{font-size:16px}
.top nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.top nav a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:4px 10px;font-size:12px}
.top nav a[aria-current="page"]{background:#fff;color:var(--navy);font-weight:700}
.badge{background:#d97706;color:#fff;font-weight:700;font-size:11px;border-radius:7px;padding:7px 14px;letter-spacing:.04em}
.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px 2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.meta b{font-weight:700}
.meta .mut{color:var(--muted)}
.uictl{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-left:auto}
.uictl span{color:var(--muted);font-size:12px;margin:0 2px 0 8px}
.uictl button{font:inherit;font-size:12px;font-weight:700;border:1px solid #cbd5e1;background:#fff;color:var(--navy);border-radius:999px;padding:3px 9px;cursor:pointer;min-width:32px}
.uictl button:hover,.uictl button:focus-visible{background:var(--navy);color:#fff;outline:none}
.uictl #scaleLbl,.uictl #fontReset{min-width:36px;text-align:center;color:var(--navy);font-weight:700;font-size:12px}
.uictl #scaleLbl{margin:0;cursor:pointer}
.live-reset{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.live-reset:hover,.live-reset:focus-visible{background:var(--navy);color:#fff;outline:none}
.live-reset[hidden]{display:none}
.warn{background:#fff3d6;color:#8a5a00;border:1px solid #e0b04a;border-radius:8px;padding:8px 12px;margin:8px 16px 0;font-weight:700}
.err{color:var(--red);font-weight:700;padding:14px 16px}
#stale[hidden],#msg:empty{display:none}
.fpctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 16px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;background:#fff;color:var(--text);border:0;padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:700}
.seg button:focus-visible{outline:2px solid #1d4ed8;outline-offset:-2px}
#togProf{font:inherit;font-size:12px;font-weight:700;border:1px solid #cbd5e1;background:#fff;color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer}
#togProf[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.sum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);padding:4px 16px 6px}
.sum b{color:var(--text);font-family:var(--fn);font-weight:700}
.sum .buy{color:var(--green)}
.sum .sell{color:var(--red)}
.fpwrap{overflow:auto;margin:0 16px 6px;border:1px solid var(--line);background:#fff;max-width:calc(100% - 32px)}
.cv{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;width:max-content}
.cv canvas{display:block}
.cv canvas.ov{position:absolute;left:0;top:0;pointer-events:none}
.cv:hover{cursor:crosshair}
.cv.grabbing,.cv.grabbing:hover{cursor:grabbing}
.foot{background:var(--foot);color:#334155;font-size:11px;line-height:1.7;padding:12px 16px;margin-top:8px}
</style>
</head>
<body>
<div class="top">
  <div class="brand">DA Flow<small>v2.0</small></div>
  <div class="ttl" id="ttl">Footprint wielu interwałów · US500</div>
  <nav aria-label="Widoki">
    <a href="footprint_us500.html">DA Flow</a>
    <a href="live_us500.html" aria-current="page">US500 na żywo</a>
    <div class="badge">NA ŻYWO</div>
  </nav>
</div>
<div class="bar2">
  <div class="meta" id="meta">Ładowanie…</div>
  <div class="uictl" role="group" aria-label="Czcionka i skala">
    <span>Czcionka</span>
    <button type="button" id="fontMinus" title="Mniejsza czcionka">A−</button>
    <button type="button" id="fontReset" title="Reset czcionki (100%)">A</button>
    <button type="button" id="fontPlus" title="Większa czcionka">A+</button>
    <span>Skala</span>
    <button type="button" id="scaleMinus" title="Pomniejsz wykres">−</button>
    <span id="scaleLbl" title="Reset skali (100%)">100%</span>
    <button type="button" id="scalePlus" title="Powiększ wykres">+</button>
  </div>
  <button type="button" class="live-reset" id="resetAll" hidden aria-label="Wróć do widoku na żywo">⟲ na żywo</button>
</div>
<div class="fpctl" id="fpctl">
  <span class="seg" id="segTf" role="group" aria-label="Interwały"></span>
  <span class="seg" id="segN" role="group" aria-label="Liczba świec"></span>
  <span class="seg" id="segMode" role="group" aria-label="Tryb wyświetlania"></span>
  <button type="button" id="togProf" aria-pressed="true">Profil sesji</button>
</div>
<div class="sum" id="sum"></div>
<div class="warn" id="stale" hidden></div>
<div class="err" id="msg"></div>
<div class="fpwrap" id="fpwrap" hidden>
  <div class="cv fp" id="fpbox" title="Przeciągnij: czas ↔, cena ↕. Kółko: cena, Shift+kółko: czas.">
    <canvas id="cMain"></canvas>
    <canvas class="ov" id="oMain"></canvas>
  </div>
</div>
<div class="foot" id="foot">Ładowanie…</div>
<script>
const TZ = 'Europe/Warsaw';
const STEP = 1, IMB = 3;
const C = {
  navy:'#1b3a5f', green:'#1f7a4d', red:'#c0392b', muted:'#66706c', text:'#1c2321',
  poc:'#1d4f91', vwap:'#9333ea', ib:'#7c3aed', onh:'#7A4FA0', nvah:'#0e7490',
  bar:'#8b958f', price:'#1c2321', spine:'#dfe3e0', hot:'#d9822b', panel:'#ffffff'
};
const FONT = '"DejaVu Sans",Verdana,"Segoe UI",system-ui,sans-serif';
const FONT_NUM = '"DejaVu Sans Mono","Liberation Mono",Consolas,Menlo,monospace';
const $ = id => document.getElementById(id);
const fmtHM = new Intl.DateTimeFormat('pl-PL', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fmtDate = new Intl.DateTimeFormat('pl-PL', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtParts = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function wp(ms) {
  const p = Object.fromEntries(fmtParts.formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return { day: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + (+p.minute) };
}
function fpx(x) { if (x == null || !isFinite(x)) return '—'; return Math.abs(x - Math.round(x)) < 1e-6 ? String(Math.round(x)) : x.toFixed(1).replace('.', ','); }
function fint(x) { if (x == null) return '—'; const n = Math.round(x); return n >= 1000 ? n.toLocaleString('pl-PL').replace(/\u00a0|\u202f/g, ' ') : String(n); }
function fdel(x) { if (x == null) return '—'; const n = Math.round(x); return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n); }
function sgnCol(x) { return (x || 0) > 0 ? C.green : (x || 0) < 0 ? C.red : C.muted; }
function kf(n) {
  const a = Math.abs(Math.round(n));
  if (a >= 10000) return Math.round(n / 1000) + 'k';
  if (a >= 1000) return (n / 1000).toFixed(1).replace('.', ',') + 'k';
  return String(Math.round(n));
}

const UI_KEY = 'live-us500-ui';
const ALL_TF = [5, 15, 30, 60];
const TF_LAB = { 5: '5', 15: '15', 30: '30', 60: '60' };
let UI = { font: 1, scale: 1, n: 6, mode: 'auto', tfs: [5, 15, 60], prof: true };
try {
  const u = JSON.parse(localStorage.getItem(UI_KEY) || '{}');
  if (u && isFinite(u.font)) UI.font = u.font;
  if (u && isFinite(u.scale)) UI.scale = u.scale;
  if (u && [4, 6, 8, 12].includes(u.n)) UI.n = u.n;
  if (u && ['auto', 'num', 'col'].includes(u.mode)) UI.mode = u.mode;
  if (u && Array.isArray(u.tfs) && u.tfs.length) UI.tfs = u.tfs.map(Number).filter(t => ALL_TF.includes(t));
  if (typeof u.prof === 'boolean') UI.prof = u.prof;
} catch (e) {}
try {
  const v = JSON.parse(localStorage.getItem('live-us500-cols') || 'null');
  if (v && !localStorage.getItem(UI_KEY + ':migrated')) {
    const t = [];
    if (v.m5 !== false) t.push(5);
    if (v.m15 !== false) t.push(15);
    if (v.h1 !== false) t.push(60);
    if (t.length) UI.tfs = t;
    if (typeof v.prof === 'boolean') UI.prof = v.prof;
  }
} catch (e) {}
if (!UI.tfs.length) UI.tfs = [5, 15, 60];
function clampUI(v, lo, hi) { return Math.max(lo, Math.min(hi, Math.round(v * 20) / 20)); }
function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify(UI)); } catch (e) {} }
function syncUI() {
  const fl = $('fontReset'), sl = $('scaleLbl');
  if (fl) fl.title = 'Reset czcionki (' + Math.round(UI.font * 100) + '%)';
  if (sl) sl.textContent = Math.round(UI.scale * 100) + '%';
  const mk = (el, items, cur) => {
    el.innerHTML = items.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${cur(v) ? 'true' : 'false'}">${l}</button>`).join('');
  };
  mk($('segTf'), ALL_TF.map(t => [t, TF_LAB[t] + (t === 60 ? ' min' : '')]), v => UI.tfs.includes(+v));
  mk($('segN'), [[4, '4'], [6, '6'], [8, '8'], [12, '12 świec']], v => +v === UI.n);
  mk($('segMode'), [['auto', 'auto'], ['num', 'liczby'], ['col', 'kolory']], v => v === UI.mode);
  $('togProf').setAttribute('aria-pressed', String(!!UI.prof));
}
function setFont(v) { UI.font = clampUI(v, 0.7, 1.5); saveUI(); syncUI(); if (LAST) render(LAST); }
function setScale(v) { UI.scale = clampUI(v, 0.5, 1.5); saveUI(); syncUI(); if (LAST) render(LAST); }
$('fontMinus').onclick = () => setFont(UI.font - 0.1);
$('fontPlus').onclick = () => setFont(UI.font + 0.1);
$('fontReset').onclick = () => setFont(1);
$('scaleMinus').onclick = () => setScale(UI.scale - 0.1);
$('scalePlus').onclick = () => setScale(UI.scale + 0.1);
$('scaleLbl').onclick = () => setScale(1);
$('segTf').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = +b.dataset.v;
  if (UI.tfs.includes(t)) { if (UI.tfs.length > 1) UI.tfs = UI.tfs.filter(x => x !== t); }
  else UI.tfs = ALL_TF.filter(x => UI.tfs.includes(x) || x === t);
  saveUI(); syncUI(); if (LAST) render(LAST);
});
$('segN').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  UI.n = +b.dataset.v; saveUI(); syncUI(); if (LAST) render(LAST);
});
$('segMode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  UI.mode = b.dataset.v; saveUI(); syncUI(); if (LAST) render(LAST);
});
$('togProf').onclick = () => { UI.prof = !UI.prof; saveUI(); syncUI(); if (LAST) render(LAST); };
syncUI();

const fbin = p => Math.floor(p / STEP + 1e-9) * STEP;
function prep(raw) {
  return raw.map(b => ({ ms: Date.parse(b.t), o: b.o, h: b.h, l: b.l, c: b.c, lv: b.lv || [] }))
    .filter(b => isFinite(b.ms)).sort((a, b) => a.ms - b.ms);
}
function agg(bars, tf) {
  const g = new Map();
  for (const b of bars) {
    const w = wp(b.ms);
    const st = b.ms - (w.min % tf) * 60000;
    let x = g.get(st);
    if (!x) { x = { st, tf, o: b.o, h: b.h, l: b.l, c: b.c, lv: new Map(), vol: 0, delta: 0, pv: 0 }; g.set(st, x); }
    x.h = Math.max(x.h, b.h); x.l = Math.min(x.l, b.l); x.c = b.c;
    for (const [p, bi, a] of b.lv) {
      const k = fbin(p);
      let z = x.lv.get(k); if (!z) { z = [0, 0]; x.lv.set(k, z); }
      z[0] += bi; z[1] += a; x.vol += bi + a; x.delta += a - bi; x.pv += p * (bi + a);
    }
  }
  const out = [...g.values()].sort((a, b) => a.st - b.st);
  let acc = 0;
  const lastMs = bars.length ? bars[bars.length - 1].ms : 0;
  let cpv = 0, cvol = 0;
  for (const x of out) {
    acc += x.delta; x.acc = acc;
    cpv += x.pv; cvol += x.vol; x.vwap = cvol > 0 ? cpv / cvol : null;
    x.incomplete = x.st + tf * 60000 > lastMs + 60000;
    let poc = null, pv = -1;
    for (const [p, [bi, a]] of x.lv) { const v = bi + a; if (v > pv || (v === pv && (poc == null || p > poc))) { pv = v; poc = p; } }
    x.poc = poc; x.maxv = Math.max(1, pv);
    x.flags = flags(x);
  }
  const done = out.filter(c => !c.incomplete && c.vol > 0);
  const av = done.length ? done.reduce((s, c) => s + c.vol, 0) / done.length : 0;
  out.forEach(c => { c.rv = av ? c.vol / av : null; });
  return out;
}
function flags(x) {
  const f = new Map(), by = x.lv;
  for (const [p, [, a]] of by) {
    const bb = by.has(p - STEP) ? by.get(p - STEP)[0] : 0;
    if (a > 0 && ((bb === 0 && a >= IMB) || (bb > 0 && a / bb >= IMB))) f.set(p, 'buy');
  }
  for (const [p, [bi]] of by) {
    const aa = by.has(p + STEP) ? by.get(p + STEP)[1] : 0;
    if (bi > 0 && ((aa === 0 && bi >= IMB) || (aa > 0 && bi / aa >= IMB))) f.set(p, f.get(p) === 'buy' ? 'both' : 'sell');
  }
  return f;
}
function va70(vol) {
  const ps = [...vol.keys()].filter(p => vol.get(p) > 0).sort((a, b) => a - b);
  if (!ps.length) return null;
  const vs = ps.map(p => vol.get(p)), tot = vs.reduce((s, v) => s + v, 0);
  let pi = 0; for (let k = 1; k < ps.length; k++) { const a = [vs[k], -Math.abs(k - ps.length / 2)], b = [vs[pi], -Math.abs(pi - ps.length / 2)]; if (a[0] > b[0] || (a[0] === b[0] && a[1] > b[1])) pi = k; }
  let lo = pi, hi = pi, acc = vs[pi];
  while (acc < 0.7 * tot && (lo > 0 || hi < ps.length - 1)) {
    const up = hi < ps.length - 1 ? vs[hi + 1] : -1, dn = lo > 0 ? vs[lo - 1] : -1;
    if (up >= dn) { hi++; acc += up; } else { lo--; acc += dn; }
  }
  return { ps, vs, tot, poc: ps[pi], val: ps[lo], vah: ps[hi] };
}
function volMap(bars) {
  const m = new Map();
  for (const b of bars) for (const [p, bi, a] of b.lv) { const k = fbin(p); m.set(k, (m.get(k) || 0) + bi + a); }
  return m;
}
function refs(bars, sess) {
  if (!bars.length) return [];
  const day = sess || wp(bars[bars.length - 1].ms).day;
  const night = [], ib = [];
  for (const b of bars) {
    const w = wp(b.ms); if (w.day !== day) continue;
    if (w.min < 930) night.push(b); else if (w.min < 990) ib.push(b);
  }
  const items = [];
  const hiOf = bs => Math.max(...bs.flatMap(b => b.lv.map(l => l[0])));
  const loOf = bs => Math.min(...bs.flatMap(b => b.lv.map(l => l[0])));
  if (ib.length) { items.push([hiOf(ib), 'IBH', C.ib]); items.push([loOf(ib), 'IBL', C.ib]); }
  if (night.length) {
    items.push([hiOf(night), 'ONH', C.onh]);
    const nv = va70(volMap(night)); if (nv) items.push([nv.vah, 'nVAH', C.nvah]);
  }
  return items.filter(i => isFinite(i[0]));
}

function font(ctx, px, bold) { ctx.font = (bold ? 'bold ' : '') + px + 'px ' + FONT; }
function fontNum(ctx, px, bold) { ctx.font = (bold ? 'bold ' : '') + px + 'px ' + FONT_NUM; }
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

let LAST = null, VIEW = null, GEO = null, CROSS = null, DRAG = null;
function blankPan() { return { endSt: null }; }
const PAN = { 5: blankPan(), 15: blankPan(), 30: blankPan(), 60: blankPan() };
let YPAN = { yManual: false, ymin: 0, ymax: 0 };

function windowEnd(all, tf) {
  if (!all.length) return -1;
  const p = PAN[tf];
  if (!p || p.endSt == null) return all.length - 1;
  let i = -1;
  for (let k = 0; k < all.length; k++) if (all[k].st <= p.endSt) i = k;
  return i < 0 ? 0 : i;
}
function visibleSlice(all, tf) {
  const end = windowEnd(all, tf), n = UI.n;
  if (end < 0) return [];
  return all.slice(Math.max(0, end - n + 1), end + 1);
}
function timeIsLive(all, tf) {
  const p = PAN[tf];
  return !p || p.endSt == null || !all.length || p.endSt >= all[all.length - 1].st;
}
function anyPanned() {
  if (!VIEW) return false;
  return YPAN.yManual || UI.tfs.some(tf => VIEW.series[tf] && !timeIsLive(VIEW.series[tf], tf));
}
function setTimeEnd(all, tf, endIdx) {
  if (!all.length) return;
  const minEnd = Math.min(all.length, UI.n) - 1;
  const j = Math.max(minEnd, Math.min(all.length - 1, Math.round(endIdx)));
  PAN[tf].endSt = j >= all.length - 1 ? null : all[j].st;
}
function setYShift(ymin, ymax, lo, hi) {
  const span = ymax - ymin;
  if (!(span > 0)) return;
  if (ymin > hi) { ymin = hi; ymax = hi + span; }
  if (ymax < lo) { ymax = lo; ymin = lo - span; }
  YPAN.yManual = true; YPAN.ymin = ymin; YPAN.ymax = ymax;
}
function resetPan() {
  PAN[5] = blankPan(); PAN[15] = blankPan(); PAN[30] = blankPan(); PAN[60] = blankPan();
  YPAN = { yManual: false, ymin: 0, ymax: 0 };
}
$('resetAll').addEventListener('click', () => { resetPan(); if (LAST) render(LAST); });

function badges(all) {
  const P = [], bin = STEP;
  all.forEach((c, i) => {
    const ks = [...c.lv.keys()].sort((a, b) => a - b);
    if (!c.vol || ks.length < 3) return;
    const rng = c.h - c.l || 1;
    const zof = k => { const z = c.lv.get(k); return { bid: z[0], ask: z[1], v: z[0] + z[1] }; };
    if (ks.length >= 4) {
      const top = ks[ks.length - 1], bot = ks[0], zt = zof(top), zb = zof(bot), lim = Math.max(2, 0.02 * c.maxv);
      if (zt.v <= 0.05 * c.maxv && zt.ask <= lim && zof(ks[ks.length - 2]).v >= 3 * Math.max(zt.v, 1))
        P.push({ i, k: top, s: 1, t: 'W' });
      if (zb.v <= 0.05 * c.maxv && zb.bid <= lim && zof(ks[1]).v >= 3 * Math.max(zb.v, 1))
        P.push({ i, k: bot, s: -1, t: 'W' });
    }
    for (const side of [1, -1]) {
      const Z = ks.filter(k => {
        const z = zof(k), mid = k + bin / 2, inB = side > 0 ? mid >= c.l + 0.6 * rng : mid <= c.l + 0.4 * rng;
        const ag = side > 0 ? z.ask : z.bid, op = side > 0 ? z.bid : z.ask;
        return inB && ag >= 10 && ag >= 2 * Math.max(op, 1);
      });
      if (Z.length < 2 || Z.reduce((a, k) => a + zof(k).v, 0) < 0.15 * c.vol) continue;
      const zlo = Math.min(...Z), zhi = Math.max(...Z) + bin;
      let j = null;
      for (let q = i + 1; q <= Math.min(all.length - 1, i + 3); q++)
        if (side > 0 ? all[q].c < zlo : all[q].c > zhi) { j = q; break; }
      if (j != null) P.push({ i, k: side > 0 ? Math.max(...Z) : Math.min(...Z), s: side, t: 'UT' });
    }
  });
  return P;
}

function fitW(cv, w, h) {
  const dpr = Math.max(1, window.devicePixelRatio || 1);

    setYShift(DRAG.lo + shift, DRAG.hi + shift, lo, hi);
  }
  e.currentTarget.classList.add('grabbing');
  drawChart();
}
function onUp(e) {
  if (!DRAG) return;
  const moved = DRAG.moved;
  try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
  e.currentTarget.classList.remove('grabbing');
  DRAG = null;
  if (moved && LAST) render(LAST);
  else onPtr(e);
}
function onWheel(e) {
  if (!GEO || !VIEW) return;
  e.preventDefault();
  const rc = e.currentTarget.getBoundingClientRect();
  const h = hit(e.clientX - rc.left, e.clientY - rc.top);
  const timeMode = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
  const raw = timeMode && !e.shiftKey ? e.deltaX : e.deltaY;
  if (timeMode && h && h.panel) setTimeEnd(h.panel.all, h.panel.tf, windowEnd(h.panel.all, h.panel.tf) + (Math.sign(raw) || 1));
  else {
    const span = GEO.hi - GEO.lo;
    const shift = -(raw / Math.max(1, GEO.Hs - GEO.T0)) * span;
    const lo = Math.min(...Object.values(VIEW.series).flatMap(s => s.map(c => c.l))) - 8;
    const hi = Math.max(...Object.values(VIEW.series).flatMap(s => s.map(c => c.h))) + 8;
    setYShift(GEO.lo + shift, GEO.hi + shift, lo, hi);
  }
  if (LAST) render(LAST);
}
{
  const w = $('fpbox');
  w.addEventListener('pointermove', onMove);
  w.addEventListener('pointerdown', onDown);
  w.addEventListener('pointerup', onUp);
  w.addEventListener('pointercancel', onUp);
  w.addEventListener('pointerleave', () => { if (!DRAG) { CROSS = null; drawCross(); } });
  w.addEventListener('wheel', onWheel, { passive: false });
}

function render(data) {
  LAST = data;
  const msg = $('msg'), stale = $('stale'), wrap = $('fpwrap'), meta = $('meta');
  msg.textContent = '';
  const bars = prep((data && data.bars) || []).filter(b => b.lv.length || b.h);
  if (!bars.length) {
    wrap.hidden = true; $('sum').innerHTML = '';
    meta.textContent = 'Brak danych US500 na żywo.';
    msg.textContent = 'Brak świec M1 w live/US500_live.json.';
    document.body.dataset.status = 'empty';
    return;
  }
  const last = bars[bars.length - 1], price = last.c;
  const updated = data.updated_at ? new Date(data.updated_at) : new Date(last.ms);
  const ageMin = (Date.now() - updated.getTime()) / 60000;
  const series = { 5: agg(bars, 5), 15: agg(bars, 15), 30: agg(bars, 30), 60: agg(bars, 60) };
  const dayDelta = series[5].length ? series[5][series[5].length - 1].acc : 0;
  const vwap = series[5].length ? series[5][series[5].length - 1].vwap : null;
  const refItems = refs(bars, data.session);
  $('ttl').textContent = `Footprint wielu interwałów · US500 · ${fmtDate.format(new Date(last.ms))} ${fmtHM.format(new Date(last.ms))} PL`;
  meta.innerHTML = `Sesja <b>${data.session || '–'}</b> od <b>${fmtHM.format(new Date(bars[0].ms))}</b> do <b>${fmtHM.format(new Date(last.ms))} PL</b>` +
    ` <span class="mut">|</span> Cena <b style="color:#1d4ed8">${fpx(price)}</b>` +
    ` <span class="mut">|</span> VWAP <b style="color:${C.vwap}">${fpx(Math.round(vwap * 10) / 10)}</b>` +
    ` <span class="mut">|</span> Delta dnia <b style="color:${sgnCol(dayDelta)}">${fdel(dayDelta)}</b>` +
    ` <span class="mut">|</span> Aktualizacja <b>${fmtHM.format(updated)} PL</b>`;
  if (ageMin > 15) { stale.hidden = false; stale.textContent = `Uwaga: dane starsze niż 15 min (ostatnia aktualizacja ${fmtHM.format(updated)} PL).`; document.body.dataset.stale = '1'; }
  else { stale.hidden = true; stale.textContent = ''; document.body.dataset.stale = '0'; }
  VIEW = { series, price, vwap, refItems, bars };
  drawChart();
  const va = VIEW.va;
  $('foot').innerHTML =
    `Bid × ask z minut M1 (flex, prawdziwy wolumen bid/ask, krok 1 pkt) · ${bars.length} minut ${fmtHM.format(new Date(bars[0].ms))}–${fmtHM.format(new Date(last.ms))} PL · wspólna oś Y dla widocznych interwałów (przeciągnij wykres ↔ cofa świece tego interwału, ↕ przesuwa cenę; kółko = cena, Shift+kółko = czas; ⟲ na żywo wraca do bieżących świec). „*” = świeca w toku.<br>` +
    `W trybie liczb / auto: bid × ask na poziomie, pogrubione = przewaga ≥ 3× (zielony ask, czerwony bid), szary pasek = wolumen poziomu względem POC świecy, niebieska ramka = POC świecy. W trybie kolorów: kolor = znak delty poziomu, nasycenie = wolumen. Pod świecą: godzina, delta, wolumen × średnia świec tego interwału w sesji. ` +
    `Jeden profil sesji z prawej, na tej samej osi Y (70% VA, POC, VWAP, świeca D1). VWAP sesji ${fpx(Math.round(vwap * 10) / 10)} (fioletowa linia).` +
    (va ? ` POC ${fpx(va.poc)} · VAH ${fpx(va.vah)} · VAL ${fpx(va.val)}.` : '') +
    `<br>Σ Δ liczona od ${fmtHM.format(new Date(bars[0].ms))} PL · czas polski (Europe/Warsaw) · strona odświeża dane co 60 s, dane aktualizowane co 5 min (pn–pt 6:00–21:55) · analiza, nie rekomendacja.`;
  Object.assign(document.body.dataset, { status: 'ok', price: String(price), vwap: String(vwap), delta: String(dayDelta), nbars: String(bars.length) });
  if (va) Object.assign(document.body.dataset, { poc: String(va.poc), vah: String(va.vah), val: String(va.val) });
}

async function load() {
  try {
    const r = await fetch('live/US500_live.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    $('fpwrap').hidden = true;
    $('meta').textContent = 'Nie udało się wczytać danych na żywo.';
    $('msg').textContent = 'Błąd wczytywania live/US500_live.json: ' + (e && e.message ? e.message : e);
    document.body.dataset.status = 'error';
  }
}
load();
setInterval(load, 60000);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (LAST) render(LAST); }, 150); });
</script>
