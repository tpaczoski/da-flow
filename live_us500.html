<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>US500 na żywo – DA Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1c2321; --mut:#66706c; --line:#dfe3e0;
  --buy:#1f7a4d; --sell:#c0392b; --va:#b07d12; --poc:#1d4f91;
  --cellbg:#ffffff; --bar:#8b958f;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --plot-bg:#f3f4f2; --plot-panel:#ffffff; --wick:#8b958f; --va-fill:rgba(29,79,145,.08);
  --px:#1c2321; --outside:#c5cdc8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --panel:#1a201e; --ink:#e3e8e5; --mut:#94a09b; --line:#2b3431;
  --buy:#4cc38a; --sell:#ef6b5b; --va:#e0b04a; --poc:#6ea8f0;
  --cellbg:#1a201e; --bar:#7d8984; color-scheme:dark;
  --plot-bg:#121615; --plot-panel:#10151d; --wick:#555f73; --va-fill:rgba(74,120,184,.14);
  --px:#ffffff; --outside:#33405a;
}}
:root[data-theme="dark"]{
  --bg:#121615; --panel:#1a201e; --ink:#e3e8e5; --mut:#94a09b; --line:#2b3431;
  --buy:#4cc38a; --sell:#ef6b5b; --va:#e0b04a; --poc:#6ea8f0;
  --cellbg:#1a201e; --bar:#7d8984; color-scheme:dark;
  --plot-bg:#121615; --plot-panel:#10151d; --wick:#555f73; --va-fill:rgba(74,120,184,.14);
  --px:#ffffff; --outside:#33405a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;min-height:100%}
body{padding:16px 16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:12px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:.01em}
.ver{font:700 11px ui-monospace,monospace;color:var(--poc);border:1px solid currentColor;border-radius:4px;padding:1px 6px;vertical-align:4px;margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button,.topnav a{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:0;padding:5px 12px;cursor:pointer;display:inline-block;text-decoration:none}
.seg button[aria-pressed="true"],.topnav a[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin:0 0 10px;font-size:14px}
.meta b{font-family:var(--f-num);font-weight:700}
.meta .mut{color:var(--mut);font-weight:400}
.warn{background:#4a3416;color:#f0a04b;border:1px solid #f0a04b;border-radius:8px;padding:8px 12px;margin:0 0 12px;font-weight:600}
:root:not([data-theme="dark"]):not(:not([data-theme="light"])) .warn{background:#fff3d6;color:#8a5a00;border-color:#e0b04a}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .warn{background:#fff3d6;color:#8a5a00;border-color:#e0b04a}}
:root[data-theme="light"] .warn{background:#fff3d6;color:#8a5a00;border-color:#e0b04a}
.err{color:var(--sell);font-weight:600;padding:20px 0}
.grid{display:grid;grid-template-columns:minmax(160px,1.1fr) minmax(0,2.4fr) minmax(0,1.4fr) minmax(0,1fr);gap:8px;height:calc(100vh - 150px);min-height:520px}
@media (max-width:1100px){.grid{grid-template-columns:1fr;height:auto}.panel{min-height:360px}}
.panel{background:var(--plot-panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.ptitle{flex:0 0 auto;padding:8px 10px 4px;font-weight:600;font-size:13px;color:var(--ink)}
.ptitle span{color:var(--mut);font-weight:500;font-size:12px}
.pview{flex:1 1 auto;overflow:auto;position:relative;min-height:0}
canvas{display:block}
.foot{margin-top:10px;color:var(--mut);font-size:12px}
#stale[hidden],#msg:empty{display:none}
#msg.err{display:block}
</style>
</head>
<body>
<header>
  <h1>DA Flow <span class="ver" title="DA Flow v1.9">v1.9</span></h1>
  <nav class="seg topnav" aria-label="Widoki">
    <a href="footprint_us500.html">DA Flow</a>
    <a href="live_us500.html" aria-current="page">US500 na żywo</a>
  </nav>
  <div class="seg" id="theme" style="margin-left:auto" aria-label="Motyw">
    <button data-v="system" aria-pressed="true">System</button>
    <button data-v="light" aria-pressed="false">Jasny</button>
    <button data-v="dark" aria-pressed="false">Ciemny</button>
  </div>
</header>
<div class="meta" id="meta">Ładowanie…</div>
<div class="warn" id="stale" hidden></div>
<div class="err" id="msg"></div>
<div class="grid" id="grid" hidden>
  <section class="panel"><div class="ptitle" id="tProf">Profil sesji</div><div class="pview"><canvas id="cProf"></canvas></div></section>
  <section class="panel"><div class="ptitle">Footprint M5 (bid × ask)</div><div class="pview" id="v5"><canvas id="c5"></canvas></div></section>
  <section class="panel"><div class="ptitle">Footprint M15 (bid × ask)</div><div class="pview" id="v15"><canvas id="c15"></canvas></div></section>
  <section class="panel"><div class="ptitle">Footprint H1 (bid × ask)</div><div class="pview" id="v60"><canvas id="c60"></canvas></div></section>
</div>
<p class="foot">Prawdziwy bid/ask z ttechou (flex). Czas polski (Europe/Warsaw). Analiza, nie rekomendacja. Odświeżanie co 60 s.</p>
<script>
(function () {
  let th = 'system';
  try { th = localStorage.getItem('fp-us500-theme') || 'system'; } catch (e) {}
  const apply = v => {
    if (v === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
    document.querySelectorAll('#theme button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  };
  apply(th);
  document.querySelectorAll('#theme button').forEach(b => b.onclick = () => {
    try { localStorage.setItem('fp-us500-theme', b.dataset.v); } catch (e) {}
    apply(b.dataset.v);
    if (window.__redraw) window.__redraw();
  });
})();

const TZ = 'Europe/Warsaw';
const $ = id => document.getElementById(id);
const fmtPL = new Intl.DateTimeFormat('pl-PL', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fmtDay = new Intl.DateTimeFormat('pl-PL', { timeZone: TZ, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fmtParts = new Intl.DateTimeFormat('en-GB', {
  timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
});

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function warsawParts(d) {
  const p = Object.fromEntries(fmtParts.formatToParts(d).map(x => [x.type, x.value]));
  return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour, mi: +p.minute };
}
function numPL(v, digits) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '–';
  return n.toLocaleString('pl-PL', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function deltaPL(v) {
  const n = Number(v) || 0;
  const s = (n > 0 ? '+' : '') + String(n);
  return s.replace('-', '−');
}

function profile(bars) {
  const prof = new Map();
  for (const b of bars) {
    for (const [p, bi, a] of b.lv || []) {
      if (!prof.has(p)) prof.set(p, [0, 0]);
      const x = prof.get(p);
      x[0] += bi; x[1] += a;
    }
  }
  const ps = [...prof.keys()].sort((a, b) => a - b);
  if (!ps.length) return null;
  const vol = new Map(ps.map(p => [p, prof.get(p)[0] + prof.get(p)[1]]));
  const tot = ps.reduce((s, p) => s + vol.get(p), 0);
  let poc = ps[0];
  for (const p of ps) if (vol.get(p) > vol.get(poc)) poc = p;
  let i = ps.indexOf(poc), j = i, acc = vol.get(poc);
  while (acc < 0.7 * tot && (i > 0 || j < ps.length - 1)) {
    const up = j < ps.length - 1 ? vol.get(ps[j + 1]) : -1;
    const dn = i > 0 ? vol.get(ps[i - 1]) : -1;
    if (up >= dn) { j += 1; acc += up; }
    else { i -= 1; acc += dn; }
  }
  const dayDelta = ps.reduce((s, p) => s + (prof.get(p)[1] - prof.get(p)[0]), 0);
  return { prof, ps, vol, tot, poc, val: ps[i], vah: ps[j], dayDelta };
}

function agg(bars, mins) {
  const g = new Map();
  const order = [];
  for (const b of bars) {
    const w = warsawParts(new Date(b.t));
    const m = w.h * 60 + w.mi;
    const bucket = Math.floor(m / mins) * mins;
    const key = `${w.y}-${String(w.mo).padStart(2, '0')}-${String(w.d).padStart(2, '0')}T${String(Math.floor(bucket / 60)).padStart(2, '0')}:${String(bucket % 60).padStart(2, '0')}`;
    if (!g.has(key)) {
      g.set(key, { t: key, o: b.o, h: b.h, l: b.l, c: b.c, lv: new Map() });
      order.push(key);
    }
    const x = g.get(key);
    x.h = Math.max(x.h, b.h);
    x.l = Math.min(x.l, b.l);
    x.c = b.c;
    for (const [p, bi, a] of b.lv || []) {
      if (!x.lv.has(p)) x.lv.set(p, [0, 0]);
      const z = x.lv.get(p);
      z[0] += bi; z[1] += a;
    }
  }
  return order.map(k => g.get(k));
}

function fitCanvas(cv, cssW, cssH) {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  cv.style.width = cssW + 'px';
  cv.style.height = cssH + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

function yScale(lo, hi, top, bot) {
  const span = (hi - lo) || 1;
  return p => top + (hi - p) / span * (bot - top);
}

function drawProfile(cv, wrap, pr, lo, hi, lastC) {
  const w = Math.max(160, wrap.clientWidth);
  const h = Math.max(360, wrap.clientHeight);
  const ctx = fitCanvas(cv, w, h);
  const top = 8, bot = h - 36, y = yScale(lo, hi, top, bot);
  const maxV = Math.max(...pr.ps.map(p => pr.vol.get(p)), 1);
  const ink = cssVar('--ink'), mut = cssVar('--mut'), pocC = cssVar('--poc'), vaC = cssVar('--va');
  const buy = cssVar('--buy'), sell = cssVar('--sell'), outside = cssVar('--outside');
  const px = cssVar('--px'), vaFill = cssVar('--va-fill');
  ctx.clearRect(0, 0, w, h);
  const left = 8, right = w - 52, barW = right - left;
  // VA band
  ctx.fillStyle = vaFill;
  const yVah = y(pr.vah + 0.25), yVal = y(pr.val - 0.25);
  ctx.fillRect(0, yVah, w, yVal - yVah);
  const rh = Math.max(2, Math.abs(y(lo) - y(lo + 0.5)) * 0.9);
  for (const p of pr.ps) {
    const v = pr.vol.get(p);
    const bw = (v / maxV) * barW;
    ctx.fillStyle = p === pr.poc ? vaC : (p >= pr.val && p <= pr.vah ? pocC : outside);
    ctx.fillRect(right - bw, y(p) - rh / 2, bw, rh);
  }
  // POC / last price
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = vaC; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y(pr.poc)); ctx.lineTo(w, y(pr.poc)); ctx.stroke();
  ctx.strokeStyle = px; ctx.lineWidth = 0.8; ctx.setLineDash([2, 4]);
  ctx.beginPath(); ctx.moveTo(0, y(lastC)); ctx.lineTo(w, y(lastC)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '11px ' + cssVar('--f-num');
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = vaC; ctx.fillText('POC ' + numPL(pr.poc, 1), right + 4, y(pr.poc));
  ctx.fillStyle = pocC; ctx.fillText('VAH ' + numPL(pr.vah, 1), right + 4, y(pr.vah));
  ctx.fillText('VAL ' + numPL(pr.val, 1), right + 4, y(pr.val));
}

function drawFp(cv, wrap, data, pr, lo, hi, lastC, scrollEnd) {
  const row = Math.max(13, Math.min(16, (wrap.clientHeight - 44) / Math.max(8, (hi - lo) / 0.5)));
  const h = Math.max(360, wrap.clientHeight, row * ((hi - lo) / 0.5) + 48);
  const cw = data.length <= 8 ? Math.max(36, Math.floor((wrap.clientWidth - 8) / Math.max(1, data.length))) : 36;
  const w = Math.max(wrap.clientWidth, Math.ceil(data.length * cw) + 8);
  const ctx = fitCanvas(cv, w, h);
  const top = 8, bot = h - 36, y = yScale(lo, hi, top, bot);
  const ink = cssVar('--ink'), mut = cssVar('--mut'), pocC = cssVar('--poc'), vaC = cssVar('--va');
  const buy = cssVar('--buy'), sell = cssVar('--sell'), wick = cssVar('--wick');
  const px = cssVar('--px'), vaFill = cssVar('--va-fill'), panel = cssVar('--plot-panel');
  const cellbg = cssVar('--cellbg');
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = vaFill;
  ctx.fillRect(0, y(pr.vah + 0.25), w, y(pr.val - 0.25) - y(pr.vah + 0.25));
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = vaC; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y(pr.poc)); ctx.lineTo(w, y(pr.poc)); ctx.stroke();
  ctx.strokeStyle = px; ctx.lineWidth = 0.8; ctx.setLineDash([2, 4]);
  ctx.beginPath(); ctx.moveTo(0, y(lastC)); ctx.lineTo(w, y(lastC)); ctx.stroke();
  ctx.setLineDash([]);
  const fs = data.length > 40 ? 8 : 9;
  ctx.font = fs + 'px ' + cssVar('--f-num');
  ctx.textAlign = 'center';
  for (let k = 0; k < data.length; k++) {
    const x = data[k];
    const cx = 4 + k * cw + cw / 2;
    // wick
    ctx.strokeStyle = wick; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, y(x.h)); ctx.lineTo(cx, y(x.l)); ctx.stroke();
    const up = x.c >= x.o;
    const col = up ? buy : sell;
    const y1 = y(Math.max(x.o, x.c)), y2 = y(Math.min(x.o, x.c));
    const bh = Math.max(Math.abs(y2 - y1), 2);
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    ctx.strokeRect(cx - cw * 0.42, y1, cw * 0.84, bh);
    let dlt = 0;
    const levels = [...x.lv.entries()].sort((a, b) => a[0] - b[0]);
    for (const [p, [bi, a]] of levels) {
      if (bi + a === 0) continue;
      const d = a - bi;
      dlt += d;
      ctx.fillStyle = cellbg;
      const ty = y(p);
      ctx.fillRect(cx - cw * 0.46, ty - 6, cw * 0.92, 12);
      ctx.fillStyle = d > 0 ? buy : (d < 0 ? sell : mut);
      ctx.textBaseline = 'middle';
      ctx.fillText(bi + 'x' + a, cx, ty);
    }
    ctx.textBaseline = 'top';
    ctx.fillStyle = dlt > 0 ? buy : (dlt < 0 ? sell : mut);
    const lab = (x.t.slice(11, 16) || x.t) + '\n' + 'Δ ' + deltaPL(dlt);
    const lines = [x.t.slice(11, 16) || x.t, 'Δ ' + deltaPL(dlt)];
    ctx.fillText(lines[0], cx, bot + 2);
    ctx.fillText(lines[1], cx, bot + 14);
  }
  if (scrollEnd && wrap._pinned !== false) {
    wrap.scrollLeft = wrap.scrollWidth;
  }
}

let LAST = null;

function render(data) {
  LAST = data;
  const msg = $('msg'), stale = $('stale'), grid = $('grid'), meta = $('meta');
  msg.textContent = '';
  if (!data || !data.bars || !data.bars.length) {
    grid.hidden = true;
    meta.textContent = 'Brak danych US500 na żywo.';
    msg.textContent = 'Brak świec M1 w live/US500_live.json.';
    document.body.dataset.status = 'empty';
    return;
  }
  const bars = data.bars.slice().sort((a, b) => a.t < b.t ? -1 : 1);
  const pr = profile(bars);
  if (!pr) {
    grid.hidden = true;
    msg.textContent = 'Brak poziomów bid/ask w danych.';
    document.body.dataset.status = 'empty';
    return;
  }
  const first = new Date(bars[0].t);
  const last = bars[bars.length - 1];
  const lastT = new Date(last.t);
  const updated = data.updated_at ? new Date(data.updated_at) : lastT;
  const ageMin = (Date.now() - updated.getTime()) / 60000;
  const price = last.c;
  meta.innerHTML =
    `Sesja ${data.session || '–'} od <b>${fmtDay.format(first)}</b> do <b>${fmtPL.format(lastT)} PL</b>` +
    ` <span class="mut">|</span> Cena <b id="price">${numPL(price, 1)}</b>` +
    ` <span class="mut">|</span> Delta dnia <b id="dayDelta">${deltaPL(pr.dayDelta)}</b>` +
    ` <span class="mut">|</span> Ostatnia aktualizacja <b id="upd">${fmtPL.format(updated)} PL</b>`;
  if (ageMin > 15) {
    stale.hidden = false;
    stale.textContent = `Uwaga: dane starsze niż 15 min (ostatnia aktualizacja ${fmtPL.format(updated)} PL).`;
    document.body.dataset.stale = '1';
  } else {
    stale.hidden = true;
    stale.textContent = '';
    document.body.dataset.stale = '0';
  }
  $('tProf').innerHTML = `Profil sesji <span>POC ${numPL(pr.poc, 1)} · VAH ${numPL(pr.vah, 1)} · VAL ${numPL(pr.val, 1)}</span>`;
  grid.hidden = false;
  const pad = 1;
  const lo = Math.min(pr.ps[0], ...bars.map(b => b.l)) - pad;
  const hi = Math.max(pr.ps[pr.ps.length - 1], ...bars.map(b => b.h)) + pad;
  drawProfile($('cProf'), $('cProf').parentElement, pr, lo, hi, price);
  drawFp($('c5'), $('v5'), agg(bars, 5), pr, lo, hi, price, true);
  drawFp($('c15'), $('v15'), agg(bars, 15), pr, lo, hi, price, true);
  drawFp($('c60'), $('v60'), agg(bars, 60), pr, lo, hi, price, true);
  document.body.dataset.status = 'ok';
  document.body.dataset.price = String(price);
  document.body.dataset.poc = String(pr.poc);
  document.body.dataset.vah = String(pr.vah);
  document.body.dataset.val = String(pr.val);
  document.body.dataset.delta = String(pr.dayDelta);
  document.body.dataset.nbars = String(bars.length);
}

window.__redraw = () => { if (LAST) render(LAST); };

async function load() {
  const msg = $('msg');
  try {
    const r = await fetch('live/US500_live.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    render(data);
  } catch (e) {
    $('grid').hidden = true;
    $('meta').textContent = 'Nie udało się wczytać danych na żywo.';
    msg.textContent = 'Błąd wczytywania live/US500_live.json: ' + (e && e.message ? e.message : e);
    document.body.dataset.status = 'error';
  }
}

load();
setInterval(load, 60000);
addEventListener('resize', () => { if (window.__redraw) window.__redraw(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (window.__redraw) window.__redraw(); });
</script>
</body>
</html>
